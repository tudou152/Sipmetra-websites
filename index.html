    <section class="hero-preview" id="recording" aria-label="iPhone 和 Mac 饮水记录">

            <img class="screenshot screenshot-portrait" src="assets/zh-CN/iphone-hydration-home.webp?v=f40eb80b22aa" width="960" height="2088" alt="iPhone 饮水首页显示 1,750 毫升、16:44 提醒和三个快捷杯量" fetchpriority="high">

          <figcaption>
            <h2>拿起 iPhone，随手记一杯。</h2>
            <p>今天喝了多少、下次几点提醒，打开就能看到。</p>
          </figcaption>
        </figure>
        <figure class="device-preview mac-preview" id="reminders">
          <div class="preview-media">
            <img class="screenshot" src="assets/zh-CN/notch-recording.webp?v=c8fa88806c75" width="1920" height="1200" alt="MacBook 上的 Sipmetra 饮水面板从刘海展开，显示 1,750 毫升和距离提醒还有 4 分钟" decoding="async">
          </div>
          <figcaption>
            <h2>从 Mac 的刘海，记下每一杯水。</h2>
            <p>到了提醒时间，饮水面板会从刘海下自动展开。想随手记一杯，也可以点菜单栏水滴，或按 <kbd>⌥ W</kbd> 打开面板。</p>

            <figcaption>

              <p>每天喝了多少、哪天达标，一眼就能看清。</p>
